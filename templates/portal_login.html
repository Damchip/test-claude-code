<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — {{ cfg.shop_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='portal.css') }}?v={{ version }}">
  <style>
    .login-box { max-width: 340px; margin: 60px auto; text-align: center; }
    .login-box input { width: 100%; padding: 11px 13px; background: var(--card); border: 1px solid var(--line);
      border-radius: 9px; color: var(--text); font: inherit; margin: 16px 0; box-sizing: border-box; }
    .login-box .err { color: var(--warn); font-size: .88rem; margin: -8px 0 10px; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="login-box">
      <h1>{{ cfg.shop_name }}</h1>
      <p class="intro">Accès réservé</p>
      <form method="post">
        {% if error %}<p class="err">{{ error }}</p>{% endif %}
        <input type="password" name="password" placeholder="Mot de passe" autofocus>
        <button type="submit" class="send" style="margin-top:0">Entrer</button>
      </form>
    </div>
  </main>
</body>
</html>
