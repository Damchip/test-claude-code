{% extends "fs/base.html" %}
{% block title %}{{ titre }}{% endblock %}
{% block body %}
<div class="legal-page">
  <header class="legal-head">
    <a class="brand" href="{{ url_for('fs.dashboard') }}">
      <img class="brand-mark" src="{{ url_for('static', filename='brand/badge.png') }}" alt="" width="38" height="38">
      <span><span class="brand-name">{{ shop.name }}</span><span class="brand-sub">File service</span></span>
    </a>
    <nav class="legal-nav">
      {% for k, t in pages.items() %}<a href="{{ url_for('fs.legal', cle=k) }}" class="{{ 'active' if k == cle }}">{{ t }}</a>{% endfor %}
    </nav>
  </header>
  <article class="card legal-body">
    <h1>{{ titre }}</h1>
    {{ contenu }}
  </article>
  <p class="legal-back"><a class="link" href="{{ url_for('fs.dashboard') }}">← Retour à l'espace client</a></p>
</div>
{% endblock %}
