<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — Carto Matcher</title>
  <style>
    :root { --bg:#0f1419; --card:#1a2129; --line:#2a333d; --text:#e6edf3; --muted:#8b98a5; --accent:#3b82f6; --err:#f87171; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .box { width:100%; max-width:340px; padding:32px; background:var(--card); border:1px solid var(--line); border-radius:14px; }
    h1 { font-size:1.15rem; margin:0 0 4px; text-align:center; }
    p.sub { color:var(--muted); text-align:center; margin:0 0 22px; font-size:.9rem; }
    input { width:100%; padding:11px 13px; background:var(--bg); border:1px solid var(--line);
            border-radius:9px; color:var(--text); font:inherit; margin-bottom:14px; }
    input:focus { outline:none; border-color:var(--accent); }
    button { width:100%; padding:12px; background:var(--accent); color:#fff; border:none;
             border-radius:9px; font-size:1rem; font-weight:600; cursor:pointer; }
    .err { color:var(--err); text-align:center; font-size:.88rem; margin:-6px 0 14px; }
    .lock { text-align:center; font-size:1.8rem; margin-bottom:6px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="lock">🔒</div>
    <h1>Carto Matcher</h1>
    <p class="sub">{{ 'Compte atelier' if equipe else 'Accès réseau protégé' }} — v{{ version }}</p>
    <form method="post">
      {% if error %}<p class="err">{{ error }}</p>{% endif %}
      {% if equipe %}
      <input type="text" name="identifiant" placeholder="Identifiant" autofocus autocomplete="username" autocapitalize="off">
      <input type="password" name="password" placeholder="Mot de passe" autocomplete="current-password">
      {% else %}
      <input type="password" name="password" placeholder="Mot de passe" autofocus autocomplete="current-password">
      {% endif %}
      <button type="submit">Se connecter</button>
    </form>
  </div>
</body>
</html>
