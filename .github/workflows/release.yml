# Publie une release GitHub : tests, zip prêt à l'emploi (dossier carto_matcher/),
# notes tirées du CHANGELOG.
#   - automatiquement quand un tag vX.Y.Z est poussé ;
#   - ou à la main : Actions → Release → Run workflow, en indiquant la version (ex. v1.54.0) ;
#     le tag est alors créé par GitHub sur le commit choisi.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. v1.54.0) — doit avoir sa section dans CHANGELOG.md"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Version
        env:
          VERSION_DEMANDEE: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          V="$VERSION_DEMANDEE"
          [[ "$V" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version invalide : $V (attendu vX.Y.Z)"; exit 1; }
          grep -q "^## ${V}\$" CHANGELOG.md || { echo "Pas de section « ## ${V} » dans CHANGELOG.md"; exit 1; }
          echo "V=$V" >> "$GITHUB_ENV"

      - name: Zip et notes de version
        run: |
          git archive --format=zip --prefix=carto_matcher/ -o "carto_matcher_${V}.zip" HEAD
          {
            echo "## Installation"
            echo "1. Décompresse le zip, puis **recopie ton dossier \`data/\` actuel** dans \`carto_matcher/\` (bibliothèque de solutions et réglages)."
            echo "2. Lance « Lancer Carto Matcher.bat » (outil interne, port 5000) et « Lancer le portail client.bat » (portail + espace client, port 5001)."
            echo "3. Mise en service du fileservice : voir la section « Fileservice » du README."
            echo
            awk -v v="## ${V}" 'index($0, v) == 1 {p = 1} p && /^## v/ && index($0, v) != 1 {exit} p' CHANGELOG.md
          } > notes.md
          cat notes.md

      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${V}" "carto_matcher_${V}.zip" \
            --title "Carto Matcher ${V}" --notes-file notes.md --target "${GITHUB_SHA}"
